name: Clean M3U Playlist

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Ссылка на лист ИЛИ имя файла (пусто = Main Mix)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run cleaner
        env:
          TARGET_SOURCE: ${{ github.event.inputs.source || secrets.MAIN_MIX_URL }}
        run: python3 clean.py

      - name: Save cleaned playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add cleaned_playlist.m3u
          if ! git diff --staged --quiet; then
            git commit -m "Clean playlist"
            git push
          else
            echo "Изменений нет."
          fi

