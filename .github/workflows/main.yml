name: Clean M3U Playlist

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Чужая ссылка для проверки (оставьте ПУСТЫМ для вашего Main Mix)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run cleaner
        env:
          TARGET_SOURCE: ${{ github.event.inputs.source || secrets.MAIN_MIX_URL }}
          OUT_NAME: ${{ (github.event_name == 'schedule' || github.event.inputs.source == '') && 'cleaned_playlist.m3u' || 'test_playlist.m3u' }}
        run: python3 clean.py

      - name: Save playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add cleaned_playlist.m3u test_playlist.m3u 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Update playlist"
            git push
          else
            echo "Изменений нет."
          fi



